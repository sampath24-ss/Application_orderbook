global:
  environment: development
  namespace: multitenant-dev

nameOverride: ""
fullnameOverride: ""

backend:
  enable: true
  replicaCount: 2

  image:
    repository: sxmpath577/multi-tenant-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: development
    PORT: "3000"
    LOG_LEVEL: info

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: sxmpath577/multi-tenant-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

postgres:
  enabled: true
  
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  
  database: multitenant_db
  username: postgres
  password: postgres123
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  enabled: true
  
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  
  password: redis123
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  
  image:
    repository: confluentinc/cp-kafka
    tag: "7.5.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9092
    targetPort: 9092
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ['sh', '-c', 'chown -R 1000:1000 /var/lib/kafka/data && chmod -R 755 /var/lib/kafka/data']
      volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
      securityContext:
        runAsUser: 0

zookeeper:
  enabled: true
  
  image:
    repository: confluentinc/cp-zookeeper
    tag: "7.5.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 2181
    targetPort: 2181
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
  
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ['sh', '-c', 'chown -R 1000:1000 /var/lib/zookeeper && chmod -R 755 /var/lib/zookeeper']
      volumeMounts:
        - name: zookeeper-data
          mountPath: /var/lib/zookeeper/data
        - name: zookeeper-logs
          mountPath: /var/lib/zookeeper/log
      securityContext:
        runAsUser: 0

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: multitenant-dev.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: multitenant-tls
      hosts:
        - multitenant-dev.example.com

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress

configMap:
  data:
    BACKEND_URL: "http://backend-service:3000"
    FRONTEND_URL: "http://frontend-service:80"
    DATABASE_HOST: "postgres-service"
    DATABASE_PORT: "5432"
    REDIS_HOST: "redis-service"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "kafka-service:9092"

secrets:
  data:
    DATABASE_PASSWORD: ""
    REDIS_PASSWORD: ""
    JWT_SECRET: ""
    API_KEY: ""
