apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multitenant-app.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
type: Opaque
data:

  {{- if .Values.secrets.data.DATABASE_PASSWORD }}
  DATABASE_PASSWORD: {{ .Values.secrets.data.DATABASE_PASSWORD | b64enc | quote }}
  {{- else }}
  DATABASE_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.data.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  {{- else }}
  REDIS_PASSWORD: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.data.JWT_SECRET }}
  JWT_SECRET: {{ .Values.secrets.data.JWT_SECRET | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.data.API_KEY }}
  API_KEY: {{ .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- else }}
  API_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}