{{- if .Values.frontend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "multitenant-app.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "multitenant-app.fullname" . }}-frontend
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.frontend.autoscaling.scaleDown.stabilizationWindowSeconds | default 300 }}
      policies:
      - type: Percent
        value: {{ .Values.frontend.autoscaling.scaleDown.percentValue | default 50 }}
        periodSeconds: {{ .Values.frontend.autoscaling.scaleDown.periodSeconds | default 60 }}
      - type: Pods
        value: {{ .Values.frontend.autoscaling.scaleDown.podsValue | default 1 }}
        periodSeconds: {{ .Values.frontend.autoscaling.scaleDown.periodSeconds | default 60 }}
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.frontend.autoscaling.scaleUp.stabilizationWindowSeconds | default 0 }}
      policies:
      - type: Percent
        value: {{ .Values.frontend.autoscaling.scaleUp.percentValue | default 100 }}
        periodSeconds: {{ .Values.frontend.autoscaling.scaleUp.periodSeconds | default 30 }}
      - type: Pods
        value: {{ .Values.frontend.autoscaling.scaleUp.podsValue | default 2 }}
        periodSeconds: {{ .Values.frontend.autoscaling.scaleUp.periodSeconds | default 30 }}
      selectPolicy: Max
{{- end }}