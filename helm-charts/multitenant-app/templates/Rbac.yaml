{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "multitenant-app.fullname" . }}-role
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "multitenant-app.fullname" . }}-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "multitenant-app.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "multitenant-app.serviceAccountName" . }}
    namespace: {{ .Values.global.namespace }}
{{- end }}






