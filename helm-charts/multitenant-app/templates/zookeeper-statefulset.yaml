{{- if .Values.zookeeper.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "multitenant-app.fullname" . }}-zookeeper
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.zookeeper.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "multitenant-app.fullname" . }}-zookeeper
  replicas: 1
  selector:
    matchLabels:
      {{- include "multitenant-app.zookeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "multitenant-app.zookeeper.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/zookeeper/data /var/lib/zookeeper/log
              echo "1" > /var/lib/zookeeper/data/myid
              chown -R 1000:1000 /var/lib/zookeeper
              chmod -R 777 /var/lib/zookeeper
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          securityContext:
            runAsUser: 0
      containers:
        - name: zookeeper
          image: "{{ .Values.zookeeper.image.repository }}:{{ .Values.zookeeper.image.tag }}"
          imagePullPolicy: {{ .Values.zookeeper.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: client
              containerPort: {{ .Values.zookeeper.service.port }}
              protocol: TCP
            - name: follower
              containerPort: 2888
              protocol: TCP
            - name: election
              containerPort: 3888
              protocol: TCP
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "{{ .Values.zookeeper.service.port }}"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_SERVER_ID
              value: "1"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          resources:
            {{- toYaml .Values.zookeeper.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  {{- if .Values.zookeeper.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
        labels:
          {{- include "multitenant-app.zookeeper.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.zookeeper.persistence.size }}
    - metadata:
        name: zookeeper-log
        labels:
          {{- include "multitenant-app.zookeeper.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  {{- else }}
  volumes:
    - name: zookeeper-data
      emptyDir: {}
    - name: zookeeper-log
      emptyDir: {}
  {{- end }}
{{- end }}