apiVersion: v1
kind: Pod
metadata:
  name: {{ include "multitenant-app.fullname" . }}-test-connection
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:latest
      command: ['wget']
      args: ['{{ include "multitenant-app.fullname" . }}-backend:{{ .Values.backend.service.port }}/health']
  restartPolicy: Never