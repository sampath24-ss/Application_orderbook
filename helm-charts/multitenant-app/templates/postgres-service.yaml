{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multitenant-app.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.postgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.targetPort }}
      protocol: TCP
      name: postgres
  selector:
    {{- include "multitenant-app.postgres.selectorLabels" . | nindent 4 }}
  clusterIP: None
{{- end }}