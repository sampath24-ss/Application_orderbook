{{- if .Values.fluentd.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
spec:
  selector:
    matchLabels:
      app: fluentd
      {{- include "multitenant-app.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fluentd
        {{- include "multitenant-app.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fluentd-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "multitenant-app.fullname" . }}-fluentd
      tolerations:
      # Allow DaemonSet to run on master/control-plane nodes
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: fluentd
        image: "{{ .Values.fluentd.image.repository }}:{{ .Values.fluentd.image.tag }}"
        imagePullPolicy: {{ .Values.fluentd.image.pullPolicy }}
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: {{ .Values.fluentd.elasticsearch.host | quote }}
        - name: FLUENT_ELASTICSEARCH_PORT
          value: {{ .Values.fluentd.elasticsearch.port | quote }}
        - name: FLUENT_ELASTICSEARCH_SCHEME
          value: {{ .Values.fluentd.elasticsearch.scheme | quote }}
        - name: FLUENT_UID
          value: "0"
        resources:
          {{- toYaml .Values.fluentd.resources | nindent 10 }}
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluentd-config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluentd-config
        configMap:
          name: {{ include "multitenant-app.fullname" . }}-fluentd-config
{{- end }}






