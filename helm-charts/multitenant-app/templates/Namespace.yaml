{{- if .Values.global.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    environment: {{ .Values.global.environment }}
  annotations:
    description: "Namespace for {{ .Values.global.environment }} environment"
{{- end }}