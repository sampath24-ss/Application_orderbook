{{- if .Values.fluentd.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  labels:
    {{- include "multitenant-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
roleRef:
  kind: ClusterRole
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ include "multitenant-app.fullname" . }}-fluentd
  namespace: {{ .Values.namespace }}
{{- end }}






