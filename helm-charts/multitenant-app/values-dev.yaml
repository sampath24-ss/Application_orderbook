global:
  environment: development
  namespace: multitenant-dev

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-backend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
  env:
    NODE_ENV: development
    PORT: "3000"
    LOG_LEVEL: debug

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgres:
  enabled: true
  database: multitenant_db
  username: postgres
  password: postgres123
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: true
  password: redis123
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi


kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: confluentinc/cp-kafka
    tag: "7.6.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9092
    targetPort: 9092
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  zookeeper:
    service:
      port: 2181

zookeeper:
  enabled: true
  replicaCount: 1
  image:
    repository: confluentinc/cp-zookeeper
    tag: "7.6.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 2181
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

networkPolicy:
  enabled: false

configMap:
  data:
    BACKEND_URL: "http://{{ .Release.Name }}-backend:3000"
    FRONTEND_URL: "http://{{ .Release.Name }}-frontend:80"
    DATABASE_HOST: "{{ .Release.Name }}-postgres-0.{{ .Release.Name }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local"
    DATABASE_PORT: "5432"
    REDIS_HOST: "{{ .Release.Name }}-redis"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "{{ .Release.Name }}-kafka-client:9092"

secrets:
  data:
    DATABASE_PASSWORD: "postgres123"
    REDIS_PASSWORD: "redis123"
    JWT_SECRET: "mysecretjwt"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true