global:
  environment: development
  namespace: multitenant-dev

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-backend
    tag: "dev-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "dev-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgres:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

kafka:
  enabled: true
  persistence:
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  hosts:
    - host: multitenant-dev.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

networkPolicy:
  enabled: false