global:
  environment: development
  namespace: multitenant-dev

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-backend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
  env:
    NODE_ENV: development
    PORT: "3000"
    LOG_LEVEL: debug

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgres:
  enabled: true
  database: multitenant_db
  username: postgres
  password: postgres123
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: true
  password: redis123
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi


zookeeper:
  enabled: true
  replicaCount: 1
  image:
    repository: bitnami/zookeeper
    tag: "3.9.2-debian-12-r0"
    pullPolicy: IfNotPresent
  env:
    - name: ALLOW_ANONYMOUS_LOGIN
      value: "yes"
    - name: ZOO_PORT_NUMBER
      value: "2181"
  service:
    type: ClusterIP
    port: 2181
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: bitnami/kafka
    tag: "3.6.1-debian-12-r4"
    pullPolicy: IfNotPresent
  env:
    - name: KAFKA_CFG_ZOOKEEPER_CONNECT
      value: "{{ .Release.Name }}-{{ .Chart.Name }}-zookeeper:2181"
    - name: KAFKA_CFG_LISTENERS
      value: "PLAINTEXT://:9092"
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: "PLAINTEXT://{{ .Release.Name }}-{{ .Chart.Name }}-kafka:9092"
    - name: ALLOW_PLAINTEXT_LISTENER
      value: "yes"
    - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
      value: "true"
    - name: KAFKA_CFG_LOG_RETENTION_HOURS
      value: "168"
  service:
    type: ClusterIP
    port: 9092
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: multitenant-dev.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

networkPolicy:
  enabled: false

configMap:
  data:
    BACKEND_URL: "http://{{ .Release.Name }}-{{ .Chart.Name }}-backend:3000"
    FRONTEND_URL: "http://{{ .Release.Name }}-{{ .Chart.Name }}-frontend:80"
    DATABASE_HOST: "{{ .Release.Name }}-{{ .Chart.Name }}-postgres"
    DATABASE_PORT: "5432"
    REDIS_HOST: "{{ .Release.Name }}-{{ .Chart.Name }}-redis"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "{{ .Release.Name }}-{{ .Chart.Name }}-kafka:9092"

secrets:
  data:
    DATABASE_PASSWORD: "cG9zdGdyZXMxMjM="
    REDIS_PASSWORD: "cmVkaXMxMjM="
    JWT_SECRET: "bXlzZWNyZXRqd3Q="
    API_KEY: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true