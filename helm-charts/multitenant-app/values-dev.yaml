global:
  environment: development
  namespace: multitenant-dev

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-backend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
  env:
    NODE_ENV: development
    PORT: "3000"
    LOG_LEVEL: debug

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "dev-latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgres:
  enabled: true
  database: multitenant_db
  username: postgres
  password: postgres123
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: true
  password: redis123
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

kafka:
  enabled: true
  persistence:
    enabled: false
  image:
    repository: confluentinc/cp-kafka
    tag: "7.5.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9092
    targetPort: 9092
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ['sh', '-c', 'chown -R 1000:1000 /var/lib/kafka/data && chmod -R 755 /var/lib/kafka/data']
      volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
      securityContext:
        runAsUser: 0
  zookeeper:
    enabled: true
    image:
      repository: confluentinc/cp-zookeeper
      tag: "7.5.0"
    service:
      port: 2181

ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: multitenant-dev.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

networkPolicy:
  enabled: false

configMap:
  data:
    BACKEND_URL: "http://multitenant-dev-multitenant-app-backend:3000"
    FRONTEND_URL: "http://multitenant-dev-multitenant-app-frontend:80"
    DATABASE_HOST: "multitenant-dev-multitenant-app-postgres"
    DATABASE_PORT: "5432"
    REDIS_HOST: "multitenant-dev-multitenant-app-redis"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "kafka-service:9092"

secrets:
  data:
    DATABASE_PASSWORD: "cG9zdGdyZXMxMjM="
    REDIS_PASSWORD: "cmVkaXMxMjM="
    JWT_SECRET: "bXlzZWNyZXRqd3Q="
    API_KEY: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true