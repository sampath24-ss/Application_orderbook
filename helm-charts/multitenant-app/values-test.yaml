global:
  environment: test
  namespace: multitenant-test

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-backend
    tag: "test-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "test-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

postgres:
  enabled: true
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  hosts:
    - host: multitenant-test.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

networkPolicy:
  enabled: false

fluentd:
  enabled: true
  elasticsearch:
    host: "elasticsearch-test.logging.svc.cluster.local"

environment: "test"
clusterName: "test-cluster"