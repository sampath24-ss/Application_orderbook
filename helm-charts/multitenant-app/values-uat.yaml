global:
  environment: uat
  namespace: multitenant-uat

backend:
  enabled: true
  replicaCount: 3
  image:
    repository: sxmpath577/multitenant-backend
    tag: "uat-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1500m
      memory: 2Gi
    requests:
      cpu: 750m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "uat-latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

postgres:
  enabled: true
  persistence:
    size: 20Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

redis:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 1500m
      memory: 2Gi
    requests:
      cpu: 750m
      memory: 1Gi

ingress:
  enabled: true
  hosts:
    - host: multitenant-uat.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: multitenant-uat-tls
      hosts:
        - multitenant-uat.example.com

networkPolicy:
  enabled: true