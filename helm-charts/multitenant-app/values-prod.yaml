global:
  environment: production
  namespace: multitenant-prod

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-backend
    tag: "latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3        # Always run at least 3 pods
    maxReplicas: 15       # Scale up to 15 pods under load
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    # More aggressive scaling in production
    scaleUp:
      stabilizationWindowSeconds: 0
      percentValue: 100
      podsValue: 3        # Add 3 pods at a time in prod
      periodSeconds: 15

postgres:
  enabled: true
  persistence:
    size: 10Gi
    storageClass: "gp2"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

kafka:
  enabled: true
  persistence:
    size: 10Gi
    storageClass: "gp2"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: app.company.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: multitenant-prod-tls
      hosts:
        - app.company.com

configMap:
  data:
    BACKEND_URL: "http://{{ .Release.Name }}-backend:3000"
    FRONTEND_URL: "http://{{ .Release.Name }}-frontend:80"
    DATABASE_HOST: "{{ .Release.Name }}-postgres-0.{{ .Release.Name }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local"
    DATABASE_PORT: "5432"
    REDIS_HOST: "{{ .Release.Name }}-redis"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "{{ .Release.Name }}-kafka-client:9092"

networkPolicy:
  enabled: false

rbac:
  create: true

serviceAccount:
  create: true

fluentd:
  enabled: false
  elasticsearch:
    host: "elasticsearch-prod.logging.svc.cluster.local"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

resourceQuota:
  enabled: true
  hard:
    requests:
      cpu: "10"
      memory: "20Gi"
      storage: "100Gi"
    limits:
      cpu: "20"
      memory: "40Gi"
    pods: "100"
    configmaps: "50"
    secrets: "50"
    replicationcontrollers: "20"
    persistentvolumeclaims: "10"
    servicesLoadbalancers: "2"
    servicesNodeports: "5"

environment: "prod"
clusterName: "prod-cluster"