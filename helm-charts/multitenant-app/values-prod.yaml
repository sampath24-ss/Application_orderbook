global:
  environment: production
  namespace: multitenant-prod

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-backend
    tag: "latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: sxmpath577/multitenant-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

postgres:
  enabled: true
  persistence:
    size: 10Gi
    storageClass: "gp2"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

kafka:
  enabled: true
  persistence:
    size: 10Gi
    storageClass: "gp2"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: app.company.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: multitenant-prod-tls
      hosts:
        - app.company.com

configMap:
  data:
    BACKEND_URL: "http://{{ .Release.Name }}-backend:3000"
    FRONTEND_URL: "http://{{ .Release.Name }}-frontend:80"
    DATABASE_HOST: "{{ .Release.Name }}-postgres-0.{{ .Release.Name }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local"
    DATABASE_PORT: "5432"
    REDIS_HOST: "{{ .Release.Name }}-redis"
    REDIS_PORT: "6379"
    KAFKA_BROKERS: "{{ .Release.Name }}-kafka-client:9092"

networkPolicy:
  enabled: false

rbac:
  create: true

serviceAccount:
  create: true